<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreX | Se viene algo grande</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617; /* Slate 950 muy oscuro */
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden; /* Evita scroll innecesario */
        }
        
        /* Contenedor del fondo interactivo */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glow-text {
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">

    <!-- Fondo de Partículas Reales -->
    <div id="particles-js"></div>

    <!-- Contenido Principal -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4">
        
        <!-- Logos -->
        <div class="flex flex-col items-center mb-10 transform transition duration-700 hover:scale-105">
            <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(37,99,235,0.4)]">
                <img src="logo.jpeg" alt="CoreX Isologotipo" class="w-16 h-16 object-contain mix-blend-multiply">
            </div>
            <img src="logo2.jpeg" alt="CoreX Typo" class="h-10 object-contain">
        </div>

        <!-- Título Principal -->
        <div class="text-center max-w-4xl mb-12">
            <h1 class="text-5xl sm:text-6xl md:text-8xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-white to-blue-200 py-2 glow-text mb-4">
                Se viene algo grande
            </h1>
            <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto font-light">
                La próxima generación de sistemas informáticos está en camino.
                <br>
                Todo lo que buscas en un solo lugar.
            </p>
        </div>


        <!-- Formulario y Progreso -->
        <div class="w-full max-w-lg glass-panel p-8 rounded-2xl">
            <div class="mb-6">
                <div class="flex justify-between text-xs text-blue-400 mb-3 font-mono tracking-widest">
                    <span>INICIALIZANDO COREX</span>
                    <span>85%</span>
                </div>
                <div class="h-1.5 w-full bg-slate-800/50 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-blue-600 via-blue-400 to-cyan-300 w-[85%] shadow-[0_0_15px_rgba(56,189,248,0.8)] relative">
                        <div class="absolute top-0 right-0 bottom-0 w-10 bg-white/30 blur-[2px] animate-pulse"></div>
                    </div>
                </div>
            </div>

            <form id="notify-form" class="flex flex-col sm:flex-row gap-4">
                <input 
                    type="email" 
                    id="email-input"
                    required
                    placeholder="Tu correo electrónico..." 
                    class="flex-grow bg-slate-900/60 border border-slate-700/50 rounded-xl px-5 py-4 text-sm md:text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all text-white placeholder-slate-500"
                >
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-4 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] whitespace-nowrap"
                >
                    Notificarme
                </button>
            </form>
            <p id="form-message" class="text-sm text-center mt-4 hidden font-medium"></p>
        </div>
    </main>

    <!-- Footer minimalista -->
    <footer class="relative z-10 w-full py-6 text-center">
        <p class="text-slate-500 text-xs tracking-wider uppercase font-medium">© 2026 CoreX IT Solutions</p>
    </footer>

    <!-- Scripts de Partículas -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Configuración premium para las partículas (red tecnológica)
        particlesJS("particles-js", {
            particles: {
                number: { value: 60, density: { enable: true, value_area: 800 } },
                color: { value: "#60A5FA" },
                shape: { type: "circle" },
                opacity: { value: 0.3, random: true },
                size: { value: 3, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#3B82F6",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 200, line_linked: { opacity: 0.5 } },
                    push: { particles_nb: 3 }
                }
            },
            retina_detect: true
        });
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_Z73Pkz2kJJIfcSS7K21HD0LfzXLWFis",
            authDomain: "corexlanding.firebaseapp.com",
            projectId: "corexlanding",
            storageBucket: "corexlanding.firebasestorage.app",
            messagingSenderId: "138983532008",
            appId: "1:138983532008:web:33d43796f58bc32938705d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('notify-form');
        const emailInput = document.getElementById('email-input');
        const submitBtn = document.getElementById('submit-btn');
        const messageEl = document.getElementById('form-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if(!email) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Conectando...';

            try {
                await addDoc(collection(db, "subscribers"), {
                    email: email,
                    timestamp: serverTimestamp()
                });
                
                submitBtn.innerHTML = '¡Acceso Asegurado!';
                submitBtn.classList.replace('bg-blue-600', 'bg-emerald-500');
                submitBtn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-400');
                submitBtn.classList.replace('shadow-[0_0_20px_rgba(37,99,235,0.3)]', 'shadow-[0_0_20px_rgba(16,185,129,0.4)]');
                
                setTimeout(() => {
                    emailInput.value = '';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Notificarme';
                    submitBtn.classList.replace('bg-emerald-500', 'bg-blue-600');
                    submitBtn.classList.replace('hover:bg-emerald-400', 'hover:bg-blue-500');
                    submitBtn.classList.replace('shadow-[0_0_20px_rgba(16,185,129,0.4)]', 'shadow-[0_0_20px_rgba(37,99,235,0.3)]');
                }, 4000);

            } catch (error) {
                console.error("Error:", error);
                messageEl.textContent = "Error de conexión. Intenta nuevamente.";
                messageEl.classList.remove('hidden', 'text-emerald-400');
                messageEl.classList.add('text-red-400');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Notificarme';
            }
        });
    </script>
</body>
</html>
