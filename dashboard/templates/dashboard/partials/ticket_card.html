<div class="bg-white border border-slate-200 p-3.5 rounded-xl flex flex-col gap-2.5 shadow-sm">
    <div class="flex justify-between items-start">
        <span class="text-[10px] font-mono text-slate-400">#{{ t.id }}</span>
        <span class="text-[10px] px-2 py-0.5 rounded font-mono 
            {% if t.prioridad == 'urgente' %} bg-red-100 text-red-700 border border-red-200
            {% elif t.prioridad == 'alta' %} bg-amber-100 text-amber-700 border border-amber-200
            {% else %} bg-blue-100 text-blue-700 border border-blue-200 {% endif %}">
            {{ t.get_prioridad_display }}
        </span>
    </div>
    <div>
        <h4 class="font-semibold text-slate-900 text-xs">{{ t.asunto }}</h4>
        <p class="text-[11px] text-slate-600 mt-1 line-clamp-2">{{ t.descripcion }}</p>
    </div>
    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-[10px] text-slate-500 font-mono">
        <span class="font-medium text-slate-700">{{ t.cliente.user.username }}</span>
        
        <form method="post" action="{% url 'actualizar_estado_ticket' t.id %}" class="inline">
            {% csrf_token %}
            <select name="estado" onchange="this.form.submit()" class="bg-slate-50 border border-slate-300 text-[10px] text-blue-600 rounded px-1.5 py-0.5 focus:outline-none font-medium">
                <option value="abierto" {% if t.estado == 'abierto' %}selected{% endif %}>Abierto</option>
                <option value="en_proceso" {% if t.estado == 'en_proceso' %}selected{% endif %}>Proceso</option>
                <option value="resuelto" {% if t.estado == 'resuelto' %}selected{% endif %}>Resuelto</option>
                <option value="cerrado" {% if t.estado == 'cerrado' %}selected{% endif %}>Cerrado</option>
            </select>
        </form>
    </div>
</div>
